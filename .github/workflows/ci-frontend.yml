name: Frontend CI

# Only run this file when frontend code changes.
on:
  push:
    branches: [main, develop]
    paths:
      - frontend/**
      - .github/workflows/ci-frontend.yml
  pull_request:
    branches: [main]
    paths:
      - frontend/**
      - .github/workflows/ci-frontend.yml

jobs:
  build:
    name: Lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build
        working-directory: frontend
        run: npm run build

  build-image:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    needs: build
    # Only push a "real" image from main, not from every PR/branch.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          # These are repo secrets, not written in this file — set them
          # in GitHub: Settings -> Secrets and variables -> Actions.
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: frontend
          file: frontend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/sushi-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/sushi-frontend:${{ github.sha }}
