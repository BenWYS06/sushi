name: Backend CI

# Only run this file when backend code changes, so frontend edits don't
# waste time rebuilding the backend.
on:
  push:
    branches: [main, develop]
    paths:
      - backend/**
      - .github/workflows/ci.yml
  pull_request:
    branches: [main]
    paths:
      - backend/**
      - .github/workflows/ci.yml

env:
  SPRING_PROFILES_ACTIVE: test

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: gradle

      - name: Run tests
        working-directory: backend
        run: chmod +x gradlew && ./gradlew test --stacktrace

  build:
    name: Build jar
    runs-on: ubuntu-latest
    # Wait for tests to pass first: no point building if tests are broken.
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: gradle

      - name: Build jar
        working-directory: backend
        # -x test = skip tests here, they already ran in the "test" job above.
        run: chmod +x gradlew && ./gradlew build -x test

  build-image:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    needs: build
    # Only push a "real" image from main, not from every PR/branch.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          # These are repo secrets, not written in this file — set them
          # in GitHub: Settings -> Secrets and variables -> Actions.
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: backend
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/sushi-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/sushi-backend:${{ github.sha }}
