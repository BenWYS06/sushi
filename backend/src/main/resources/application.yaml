spring:
  # Enable the separate "ai" profile after setting up Ollama and pgvector.
  ai:
    model:
      chat: none
      embedding: none
    vectorstore:
      type: none

  application:
    name: sushi-api

  docker:
    compose:
      enabled: false

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:sushi_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 20
        jdbc:
          batch_size: 20

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  flyway:
    enabled: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

  cache:
    type: redis

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${EMAIL_USERNAME:dummy@example.com}
    password: ${EMAIL_PASSWORD:dummy-password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:dummy-google-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:dummy-google-client-secret}
            scope:
              - email
              - profile
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo
            user-name-attribute: sub

server:
  port: 8080

app:
  jwt:
    secret: ${JWT_SECRET:local-development-jwt-secret-at-least-32-characters-long}
    expiration: 86400000
  s3:
    bucket: ${AWS_S3_BUCKET:}
    region: ${AWS_REGION:us-east-1}
    key-prefix: ${AWS_S3_KEY_PREFIX:products}
    public-url: ${AWS_S3_PUBLIC_URL:}
    allowed-types: image/jpeg,image/png,image/webp
    max-size: 5242880
  rate-limit:
    # Vite is trusted locally. Add your proxy IP here when one is introduced.
    trusted-proxies: ${RATE_LIMIT_TRUSTED_PROXIES:127.0.0.1,::1}
  base-url: ${APP_BASE_URL:http://localhost:5173}
  stripe:
    secret-key: ${STRIPE_SECRET_KEY:dummy-stripe-secret-key}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:dummy-stripe-webhook-secret}

logging:
  level:
    com.sushishop: DEBUG
    org.springframework.cache: TRACE
    org.springframework.data.redis: DEBUG

management:
  health:
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    prometheus:
      enabled: true
