# Same stack as compose.yaml, but backend/frontend are PULLED from
# DockerHub instead of built from local source. Use this after CI has
# pushed an image (see .github/workflows/ci.yml and ci-frontend.yml).
#
# Usage:
#   1. Add DOCKERHUB_USERNAME=<your-dockerhub-username> to your .env
#   2. docker compose -f compose.prod.yaml pull
#   3. docker compose -f compose.prod.yaml up -d

services:
  postgres:
    image: 'pgvector/pgvector:pg16'
    container_name: sushi-postgres
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - '${DB_PORT}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - sushi-net
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: 'redis:7-alpine'
    container_name: sushi-redis
    ports:
      - '${REDIS_PORT}:6379'
    networks:
      - sushi-net
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    image: ${DOCKERHUB_USERNAME}/sushi-backend:latest
    container_name: sushi-backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SERVER_PORT: 8080
      JWT_SECRET: ${JWT_SECRET}
      EMAIL_USERNAME: ${EMAIL_USERNAME}
      EMAIL_PASSWORD: ${EMAIL_PASSWORD}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      APP_BASE_URL: ${APP_BASE_URL}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker}
    ports:
      - '8080:8080'
    networks:
      - sushi-net
    volumes:
      - ./backend/uploads:/app/uploads
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    image: ${DOCKERHUB_USERNAME}/sushi-frontend:latest
    container_name: sushi-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - '5173:80'
    networks:
      - sushi-net
    restart: unless-stopped

networks:
  sushi-net:
    driver: bridge

volumes:
  postgres_data:
